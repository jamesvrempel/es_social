{% extends "templates/web.html" %}
{% block title %}Photos{% endblock %}
{% block head_include %}<link rel="stylesheet" href="/assets/es_social/css/es_social.css">{% endblock %}
{% block page_content %}
<div class="es-social" data-page="photos" data-slug="{{ slug or '' }}">
  <div class="es-topbar">
    <div class="es-brand"><a href="/social">ES&nbsp;Social</a></div>
    <nav class="es-nav">
      <a href="/social">Home</a>
      <a href="/social/photos">Photos</a>
      <a href="/social/connections">Friends</a>
      <a href="/social/groups">Groups</a>
    </nav>
  </div>
  <div class="es-layout es-layout-narrow"><main class="es-main">
    <div class="es-card">
      <div class="es-card-head">
        <div class="es-card-title" id="es-albums-title">Albums</div>
        <button class="es-btn es-btn-primary" id="es-new-album" style="display:none">+ New album</button>
      </div>
      <div id="es-albums-grid" class="es-album-grid"></div>
      <div id="es-albums-empty" class="es-muted"></div>
    </div>
    <div class="es-card">
      <div class="es-card-head">
        <div class="es-card-title" id="es-photos-title">Photos</div>
        <button class="es-btn es-btn-primary" id="es-upload-photos" style="display:none">＋ Upload photos</button>
      </div>
      <div id="es-photo-grid" class="es-photo-grid"></div>
      <div id="es-photos-empty" class="es-muted es-center"></div>
    </div>
  </main></div>
</div>
<script>window.ES_CFG = {csrf: "{{ csrf_token }}"};</script>
<script src="/assets/es_social/js/es_social.js"></script>
{% endblock %}
