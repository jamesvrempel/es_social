{% extends "templates/web.html" %}
{% block title %}Group{% endblock %}
{% block head_include %}<link rel="stylesheet" href="/assets/es_social/css/es_social.css">{% endblock %}
{% block page_content %}
<div class="es-social" data-page="group" data-group="{{ group_name }}">
  <div class="es-topbar"><div class="es-brand"><a href="/social">ES&nbsp;Social</a></div>
    <nav class="es-nav"><a href="/social">Home</a><a href="/social/photos">Photos</a><a href="/social/connections">Friends</a><a href="/social/groups">Groups</a></nav></div>
  <div class="es-profile-head es-card" id="es-group-head"><div class="es-muted es-center">Loading…</div></div>
  <div class="es-layout es-layout-narrow"><main class="es-main">
    <div class="es-card es-composer" id="es-group-composer" style="display:none">
      <textarea id="es-composer-text" placeholder="Post to this group…"></textarea>
      <div class="es-composer-row"><span class="es-muted">Posting to group</span><button id="es-post-btn" class="es-btn es-btn-primary">Post</button></div>
    </div>
    <div id="es-feed"></div><div id="es-feed-sentinel" class="es-muted es-center"></div>
  </main></div>
</div>
<script>window.ES_CFG = {csrf: "{{ csrf_token }}"};</script>
<script src="/assets/es_social/js/es_social.js"></script>
{% endblock %}
