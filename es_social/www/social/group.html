{% extends "templates/web.html" %}
{% block title %}Group · {{ es_brand }}{% endblock %}
{% block head_include %}<link rel="stylesheet" href="/assets/es_social/css/es_social.css?v={{ es_v }}">{% endblock %}
{% block page_content %}
<div class="es-social" data-page="group" data-group="{{ group_name }}">
  <div class="es-topbar"><div class="es-brand"><a href="/social">{{ es_brand }}</a></div>
    {% include "templates/includes/es_social_nav.html" %}</div>
  <div class="es-profile-head es-card" id="es-group-head"><div class="es-muted es-center">Loading…</div></div>
  <div class="es-layout es-layout-narrow"><main class="es-main">
    <div class="es-card es-composer" id="es-group-composer" style="display:none">
      <textarea id="es-composer-text" placeholder="Post to this group…"></textarea>
      <div class="es-composer-row"><span class="es-muted">Posting to group</span>
        {% if es_flags.events %}<button id="es-event-btn" class="es-btn" type="button">📅 Event</button>{% endif %}
        <button id="es-post-btn" class="es-btn es-btn-primary">Post</button></div>
    </div>
    <div class="es-tabs" id="es-group-tabs" hidden>
      <button data-tab="feed" class="active">Posts</button>
      <button data-tab="members">Members</button>
      <button data-tab="albums">Albums</button>
      <button data-tab="events">Events</button>
      <button data-tab="admin" id="es-admin-tab" hidden>Admin</button>
    </div>
    <div id="es-group-panel" hidden></div>
    <div id="es-feed"></div><div id="es-feed-sentinel" class="es-muted es-center"></div>
  </main></div>
</div>
<script>window.ES_CFG = {csrf: "{{ csrf_token }}", is_guest: {{ (is_guest or False) | tojson }}, signup_url: {{ signup_url | tojson }}, providers: {{ (login_providers or []) | tojson }}, flags: {{ (es_flags or {}) | tojson }}, brand: {{ (es_brand or "ES Social") | tojson }}};</script>
<script src="/assets/es_social/js/es_social.js?v={{ es_v }}"></script>
<script src="/assets/es_social/js/es_social_phases.js?v={{ es_v }}"></script>
{% endblock %}
